name: Publish NuGet

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      PACKAGE_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GuiDispatcher.Sharp.csproj

      - name: Build
        run: dotnet build GuiDispatcher.Sharp.csproj --configuration Release --no-restore

      - name: Show package version
        run: |
          echo "Package version: $PACKAGE_VERSION"

      - name: Pack
        run: |
          dotnet pack GuiDispatcher.Sharp.csproj --configuration Release --no-build --output ./artifacts /p:PackageVersion=$PACKAGE_VERSION

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: buchmiet

      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
